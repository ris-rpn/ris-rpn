<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Direktorat RIS — PT Riset Perkebunan Nusantara</title>
    <meta
      name="description"
      content="Direktorat Riset, Inovasi, dan Sustainability PT Riset Perkebunan Nusantara — pimpinan, divisi, dan akses dashboard manajemen."
    />
    <meta name="theme-color" content="#06132B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="is-loading">
    <a class="skip-link" href="#main">Lewati ke konten</a>

    <!-- INTRO -->
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro__panel intro__panel--top"></div>
      <div class="intro__panel intro__panel--bottom"></div>
      <canvas class="intro__canvas"></canvas>
      <div class="intro__meta intro__meta--tl"><span data-intro-company>PT Riset Perkebunan Nusantara</span></div>
      <div class="intro__meta intro__meta--tr"><span>Riset · Inovasi · Sustainability</span></div>
      <div class="intro__meta intro__meta--bl"><span class="intro__count">000</span></div>
      <button class="intro__skip" type="button">Lewati intro <span aria-hidden="true">→</span></button>
    </div>

    <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

    <!-- HEADER -->
    <header class="header">
      <a class="header__brand" href="#beranda" aria-label="Kembali ke awal">
        <img class="header__logo" data-slot="logo" alt="" hidden />
        <span class="header__mark" data-slot="brand-mark">RIS</span>
        <span class="header__brand-text" data-slot="brand-text">Direktorat RIS</span>
      </a>
      <nav class="header__actions" aria-label="Utama">
        <a class="header__link" href="#dashboard">Dashboard</a>
        <button class="header__menu" type="button" aria-expanded="false" aria-controls="menu">
          <span class="header__menu-label">Menu</span>
          <span class="header__menu-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
      </nav>
    </header>

    <!-- MENU OVERLAY -->
    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Navigasi" hidden>
      <div class="menu__inner">
        <ol class="menu__list" data-slot="menu-list"></ol>
        <div class="menu__aside" data-slot="menu-aside"></div>
      </div>
    </div>

    <!-- PROGRESS -->
    <nav class="progress" aria-label="Bagian halaman">
      <ol data-slot="progress"></ol>
    </nav>

    <main id="main">
      <!-- HERO -->
      <section class="hero" id="beranda" data-theme="dark" data-nav="Beranda">
        <canvas class="hero__canvas" aria-hidden="true"></canvas>
        <div class="hero__fallback" aria-hidden="true">RIS</div>
        <div class="hero__grid" aria-hidden="true"></div>
        <div class="hero__inner container">
          <p class="hero__eyebrow">
            <span class="dot"></span><span data-slot="company-name">PT Riset Perkebunan Nusantara</span>
          </p>
          <div class="hero__foot">
            <h1 class="hero__title">
              <span class="hero__line">Riset,</span>
              <span class="hero__line">Inovasi,</span>
              <span class="hero__line"><em>&amp;</em> Sustainability</span>
            </h1>
            <a class="hero__scroll" href="#angka" aria-label="Gulir ke bawah">
              <span>Gulir</span><span class="hero__scroll-line" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ANGKA -->
      <section class="about" id="angka" data-theme="light" aria-label="Direktorat dalam angka">
        <div class="container">
          <div class="about__stats" data-slot="stats"></div>
        </div>
      </section>

      <div class="band" aria-hidden="true">
        <div class="marquee"><div class="marquee__track" data-slot="komoditas"></div></div>
      </div>

      <!-- PIMPINAN, DIVISI, PENDUKUNG, DASHBOARD dirender dari public/content/*.json -->
      <div data-slot="pimpinan"></div>
      <div data-slot="divisi"></div>
      <div data-slot="pendukung"></div>

      <section class="dash" id="dashboard" data-theme="dark" data-nav="Dashboard">
        <div class="container">
          <div class="dash__head">
            <p class="label"><span class="label__no" data-slot="dash-no">(05)</span> Dashboard Manajemen</p>
            <h2 class="dash__title" data-reveal="lines">Akses data,<br /><em>satu pintu.</em></h2>
            <div class="dash__filters" role="group" aria-label="Saring dashboard" data-slot="dash-filters"></div>
          </div>
          <ul class="dash__grid" data-slot="dash-grid"></ul>
        </div>
      </section>
    </main>

    <footer class="footer" data-theme="dark">
      <div class="container" data-slot="footer"></div>
    </footer>

    <noscript>
      <div class="noscript">Aktifkan JavaScript untuk menampilkan halaman Direktorat RIS.</div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
